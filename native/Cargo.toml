[package]
name = "kit-services-tab"
description = "The Services tab of the services kit: Rust, built to WebAssembly"
version = "0.1.2"
edition = "2024"
publish = false

# A cdylib is the module Hangar loads (tabs/services.wasm); the rlib is for
# `cargo test`, which runs the tab on the host with hangar_kit_sdk::testing.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hangar-kit-sdk = { git = "https://github.com/hangar-ai/hangar", branch = "feat/native-rust" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# The tests keep the JS tests' patterns as they were written; the module does
# not link it.
[dev-dependencies]
regex = "1"
